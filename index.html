
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度写真ビューア</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
        }

        #menu {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        #photoSelect {
            font-size: 16px;
            padding: 6px;
            max-width: 75%;
        }

        #panorama {
            width: 100%;
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

<div id="menu">
    <label for="photoSelect">写真を選択：</label>
    <select id="photoSelect">
        <option value="photo111">写真1</option>
        <option value="photo112">写真2</option>
        <option value="photo113">写真3</option>
        <option value="photo114">写真4</option>
        <option value="photo115">写真5</option>
        <option value="photo116">写真6</option>
        <option value="photo117">写真7</option>
        <option value="photo118">写真8</option>
    </select>
</div>

<div id="panorama"></div>

<script>
    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "photo111",
            "sceneFadeDuration": 500
        },

        "scenes": {
            "photo111": {
                "title": "写真1",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_153353_00_111.jpg",
                "autoLoad": true
            },

            "photo112": {
                "title": "写真2",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_153842_00_112.jpg",
                "autoLoad": true
            },

            "photo113": {
                "title": "写真3",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_154026_00_113.jpg",
                "autoLoad": true
            },

            "photo114": {
                "title": "写真4",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_155009_00_114.jpg",
                "autoLoad": true
            },

            "photo115": {
                "title": "写真5",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_155432_00_115.jpg",
                "autoLoad": true
            },

            "photo116": {
                "title": "写真6",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_155912_00_116.jpg",
                "autoLoad": true
            },

            "photo117": {
                "title": "写真7",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_160506_00_117.jpg",
                "autoLoad": true
            },

            "photo118": {
                "title": "写真8",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_160913_00_118.jpg",
                "autoLoad": true
            }
        }
    });

    document.getElementById('photoSelect').addEventListener('change', function () {
        viewer.loadScene(this.value);
    });
</script>

</body>
</html>
