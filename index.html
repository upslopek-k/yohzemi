
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度写真ビューア</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #menu {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        #photoSelect {
            font-size: 16px;
            padding: 6px;
        }

        #panorama {
            width: 100%;
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

<div id="menu">
    <label for="photoSelect">写真を選択：</label>
    <select id="photoSelect">
        <option value="photo111">写真1</option>
        <option value="photo112">写真2</option>
    </select>
</div>

<div id="panorama"></div>

<script>
    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "photo111",
            "sceneFadeDuration": 500
        },
        "scenes": {
            "photo111": {
                "title": "写真1",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_153353_00_111.jpg",
                "autoLoad": true
            },
            "photo112": {
                "title": "写真2",
                "type": "equirectangular",
                "panorama": "./IMG_20261014_153842_00_112.jpg",
                "autoLoad": true
            }
        }
    });

    document.getElementById('photoSelect').addEventListener('change', function () {
        viewer.loadScene(this.value);
    });
</script>

</body>
</html>
